<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@400;600&display=swap"><link rel="stylesheet" href="style.css"><title>Country Royale sign-in</title></head><body><main><h1>Connecting…</h1><p id="m">Finishing your TikTok sign-in.</p>
<script>
// One TikTok redirect address serves two places: the Studio page (state starts "studio.") and the
// publisher on PH's computer (everything else).
const q = new URLSearchParams(location.search);
if (!q.has('code') && !q.has('error')) document.getElementById('m').textContent = 'No sign-in code was received.';
else if ((q.get('state') || '').startsWith('studio.')) location.replace('studio/' + location.search);
else location.replace('http://127.0.0.1:8766/' + location.search);
</script></main></body></html>
